[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers -------------------------------------------------
# Applied to every response. Strict CSP with no 'unsafe-inline' scripts —
# fonts are self-hosted (no external font-host allowance needed), and the
# only external script/frame/connect sources are the ones actually used:
# Google Maps embed (Contact page iframe), and GA4/Meta Pixel (only ever
# loaded client-side after cookie consent — see src/lib/analytics.ts).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://www.googletagmanager.com https://connect.facebook.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://www.facebook.com;
      font-src 'self' data:;
      connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://connect.facebook.net;
      frame-src https://www.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """

# Long-lived caching for hashed static assets (Vite fingerprints filenames).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Functions get their own CORS-free, same-origin headers (no extra
# Access-Control-Allow-Origin needed since the site calls them same-origin).
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
